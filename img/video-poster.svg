<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Póster del video con un campo de estrellas y el título Galaxia Star Wars">
  <defs>
    <linearGradient id="poster-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#143a63"/>
    </linearGradient>
    <radialGradient id="poster-glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#5aa9e6" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#5aa9e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#poster-sky)"/>
  <rect width="1280" height="720" fill="url(#poster-glow)"/>

  <g fill="#e9eef7">
    <circle cx="90" cy="80" r="1.8" opacity=".8"/>
    <circle cx="220" cy="150" r="1.2" opacity=".6"/>
    <circle cx="340" cy="70" r="2.0" opacity=".85"/>
    <circle cx="470" cy="190" r="1.4" opacity=".65"/>
    <circle cx="600" cy="90" r="1.6" opacity=".75"/>
    <circle cx="760" cy="160" r="1.1" opacity=".55"/>
    <circle cx="900" cy="60" r="1.9" opacity=".82"/>
    <circle cx="1040" cy="140" r="1.3" opacity=".6"/>
    <circle cx="1180" cy="90" r="1.7" opacity=".78"/>
    <circle cx="160" cy="300" r="1.2" opacity=".55"/>
    <circle cx="420" cy="260" r="1.5" opacity=".7"/>
    <circle cx="700" cy="300" r="1.1" opacity=".5"/>
    <circle cx="980" cy="250" r="1.6" opacity=".72"/>
    <circle cx="1120" cy="320" r="1.2" opacity=".58"/>
    <circle cx="80" cy="520" r="1.5" opacity=".68"/>
    <circle cx="300" cy="600" r="1.2" opacity=".55"/>
    <circle cx="520" cy="540" r="1.3" opacity=".6"/>
    <circle cx="880" cy="580" r="1.6" opacity=".7"/>
    <circle cx="1080" cy="620" r="1.2" opacity=".55"/>
    <circle cx="1220" cy="500" r="1.5" opacity=".65"/>
  </g>
  <g fill="#ffe81f">
    <circle cx="250" cy="110" r="2.0" opacity=".95"/>
    <circle cx="820" cy="360" r="1.8" opacity=".9"/>
    <circle cx="1100" cy="480" r="1.6" opacity=".85"/>
    <circle cx="600" cy="620" r="1.7" opacity=".88"/>
  </g>

  <text x="640" y="340" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif" font-size="88" font-weight="700"
        fill="#ffe81f" letter-spacing="6">STAR WARS</text>
  <text x="640" y="400" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="600"
        fill="#e9eef7" letter-spacing="3">Galaxia Star Wars</text>
  <text x="640" y="470" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif" font-size="20"
        fill="#a9b4c7">Hace mucho tiempo, en una galaxia muy, muy lejana</text>
</svg>
