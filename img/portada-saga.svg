<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="60%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#16203a"/>
    </linearGradient>
    <radialGradient id="nebula" cx="70%" cy="30%" r="55%">
      <stop offset="0" stop-color="#5aa9e6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5aa9e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff9f45"/>
      <stop offset="55%" stop-color="#b32424"/>
      <stop offset="100%" stop-color="#4a0f1a"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#nebula)"/>

  <g fill="#e9eef7">
    <circle cx="60" cy="70" r="1.8" opacity=".85"/>
    <circle cx="140" cy="40" r="1.2" opacity=".6"/>
    <circle cx="220" cy="96" r="2.0" opacity=".9"/>
    <circle cx="310" cy="52" r="1.3" opacity=".65"/>
    <circle cx="420" cy="88" r="1.7" opacity=".8"/>
    <circle cx="500" cy="44" r="1.1" opacity=".55"/>
    <circle cx="590" cy="110" r="1.6" opacity=".75"/>
    <circle cx="690" cy="60" r="1.2" opacity=".6"/>
    <circle cx="750" cy="150" r="1.9" opacity=".85"/>
    <circle cx="96" cy="180" r="1.3" opacity=".6"/>
    <circle cx="180" cy="230" r="1.5" opacity=".7"/>
    <circle cx="360" cy="170" r="1.1" opacity=".55"/>
    <circle cx="470" cy="200" r="1.7" opacity=".8"/>
    <circle cx="640" cy="250" r="1.3" opacity=".6"/>
    <circle cx="40" cy="300" r="1.4" opacity=".65"/>
    <circle cx="260" cy="300" r="1.2" opacity=".55"/>
    <circle cx="700" cy="330" r="1.5" opacity=".7"/>
  </g>
  <g fill="#ffe81f">
    <circle cx="160" cy="130" r="2.0" opacity=".95"/>
    <circle cx="540" cy="150" r="1.8" opacity=".9"/>
    <circle cx="80" cy="240" r="1.6" opacity=".8"/>
    <circle cx="330" cy="120" r="1.5" opacity=".75"/>
    <circle cx="620" cy="330" r="1.7" opacity=".85"/>
  </g>

  <!-- Ringed planet -->
  <g transform="translate(600 150)">
    <ellipse rx="120" ry="30" fill="none" stroke="#a9b4c7" stroke-opacity=".45" stroke-width="6" transform="rotate(-18)"/>
    <circle r="70" fill="url(#planet)"/>
    <circle r="70" fill="none" stroke="#ff9f45" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- Small moon -->
  <circle cx="180" cy="120" r="26" fill="#a9b4c7" opacity=".7"/>
  <circle cx="170" cy="112" r="6" fill="#7f8a9e" opacity=".6"/>
  <circle cx="190" cy="132" r="4" fill="#7f8a9e" opacity=".6"/>

  <!-- Shooting star streak -->
  <g opacity=".85">
    <line x1="300" y1="60" x2="430" y2="130" stroke="#e9eef7" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="430" cy="130" r="2.6" fill="#e9eef7"/>
  </g>

  <!-- Distant lightsaber blade glow -->
  <g opacity=".8">
    <line x1="120" y1="360" x2="120" y2="250" stroke="#5aa9e6" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="360" x2="120" y2="250" stroke="#e9eef7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground silhouette -->
  <path d="M0 386 L90 330 L170 372 L250 322 L330 376 L420 336 L510 388 L600 340 L700 392 L800 348 L800 500 L0 500 Z" fill="url(#hills)"/>
  <path d="M0 430 L110 396 L210 436 L320 402 L440 442 L560 408 L680 446 L800 414 L800 500 L0 500 Z" fill="#05070d"/>
</svg>
